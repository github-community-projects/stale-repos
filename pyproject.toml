[project]
name = "stale-repos"
version = "1.0.0"
description = "GitHub Action that finds stale repositories in a GitHub organization."
requires-python = ">=3.11"
dependencies = [
    "PyGithub==2.9.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
    "mypy==2.4.1",
    "mypy-extensions==1.2.0",
    "pylint==4.1.3",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]
